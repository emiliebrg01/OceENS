name: Architecture

on: [push, pull_request]

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install the project from uv.lock
        run: uv sync --frozen

      - name: No private name reached from outside its package
        run: uv run tach check

      - name: No import cycle between packages
        run: uv run python scripts/check_cycles.py

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install the project from uv.lock
        run: uv sync --frozen

      - name: Run the tests
        run: uv run pytest
